<script>
// ── Chạy trong "Khu vực trò chơi" của app Mủ Cao Su ──
// Dữ liệu game lưu với tiền tố riêng 'mcsg_' (không đồng bộ lên Supabase, không đụng khoá của app khác cùng tên miền).
// window.Android giả lập các hàm của vỏ APK để game chạy y như trong APK; "Thoát" thì đóng màn game, về lại app.
(function(){
  var P = 'mcsg_', L = window.localStorage;
  window.MCSG_LS = { getItem: function(k){ return L.getItem(P + k); }, setItem: function(k, v){ L.setItem(P + k, v); }, removeItem: function(k){ L.removeItem(P + k); } };
  function host(){ try { return window.parent !== window && window.parent.GAME_FRAME || null; } catch(e){ return null; } }
  window.Android = {
    load: function(k){ return L.getItem(P + k); },
    save: function(k, s){ if (s == null) L.removeItem(P + k); else L.setItem(P + k, s); },
    vibrate: function(ms){ try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){} },
    exit: function(){ var h = host(); if (h) h.close(); },
    setLandscape: function(on){ try { if (on) screen.orientation.lock('landscape').catch(function(){}); else screen.orientation.unlock(); } catch(e){} }
  };
  // Tắt/bật toàn bộ âm thanh của game khi app tạm cất game (bấm "về Thu Mua"): ghi nhận mọi AudioContext game tạo ra;
  // lúc đang tắt tiếng thì chặn game tự bật lại âm thanh.
  var ACs = [], muted = false, AC0 = window.AudioContext || window.webkitAudioContext;
  if (AC0){
    var W = function(o){
      var c = o === undefined ? new AC0() : new AC0(o), res = c.resume.bind(c);
      c.resume = function(){ return muted ? Promise.resolve() : res(); };
      ACs.push(c); if (muted) try { c.suspend(); } catch(e){}
      return c;
    };
    W.prototype = AC0.prototype;
    window.AudioContext = W; if (window.webkitAudioContext) window.webkitAudioContext = W;
  }
  window.__mcsgMute = function(on){ muted = !!on; ACs.forEach(function(c){ try { if (on) c.suspend(); else c.resume(); } catch(e){} }); };
})();
</script>

window.__errs = [];

  } catch (e) {}
}
window.onerror = function (msg, src, line, col) { showFatal(msg + ' (dòng ' + line + ':' + col + ')'); };

<script>

const Store = {

const SIZES = [

/* ================= Khối ================= */
const COLORS = ['#e8463a', '#f57c22', '#f7c21c', '#3dbb2a', '#1fb5ae', '#4d7ee0', '#b452e0', '#7d6a58'];
const GRAY = 7;
const PIECES = [
  // 7 khối cơ bản (4 ô)
  { m: ['....', '####', '....', '....'], c: 4 },

  { m: ['.#.', '###', '...'], c: 6 },
  { m: ['.##', '##.', '...'], c: 3 },
  { m: ['##.', '.##', '...'], c: 0 },
  { m: ['#..', '###', '...'], c: 5 },
  { m: ['..#', '###', '...'], c: 1 },
  // khối mở rộng

  { m: ['#.', '##'], c: 3 },
  { m: ['.#.', '###', '.#.'], c: 0 },
  { m: ['#.#', '###', '...'], c: 6 },
  { m: ['###.', '..#.', '..#.', '..#.'], c: 2 },
  { m: ['##.', '##.', '#..'], c: 1 },
  { m: ['###', '.#.', '.#.'], c: 4 },
  { m: ['#..', '#..', '###'], c: 5 },

const SP = { dot: 16, bomb: 17, gun: 18 };
const SP_INFO = {
  dot: ['Hạt xuyên!', 'Rơi xuyên gạch, lấp ô trống sâu nhất'],
  bomb: ['Bom!', 'Chạm gạch là nổ, phá cả vùng gạch bên dưới'],
  gun: ['Súng bắn!', 'Chạm / phím Xoay để bắn phá gạch']

function spOf(p) { return p ? PIECES[p.t].sp : undefined; }
function isDot(p) { return spOf(p) === 'dot'; }
function parse(rows) {
  const n = Math.max(rows.length, ...rows.map(r => r.length));
  const m = [];
  for (let y = 0; y < n; y++) { m.push([]); for (let x = 0; x < n; x++) m[y].push(rows[y] && rows[y][x] === '#' ? 1 : 0); }

}

  return { x0, y0, x1, y1, w: x1 - x0 + 1, h: y1 - y0 + 1 };

/* ================= Âm thanh & rung ================= */
let AC = null;
function audio() {

  const a = audio(); if (!a) return;
  const len = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, len, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
  const src = a.createBufferSource(), g = a.createGain(), f = a.createBiquadFilter();

  src.buffer = buf; src.connect(f); f.connect(g); g.connect(a.destination); src.start();
}
function sfx(k, n) {
  if (!SET.sound) return;
  switch (k) {
    case 'move': tone(420, .04, 'square', .03); break;
    case 'rot': tone(620, .06, 'triangle', .07, 820); break;
    case 'lock': tone(150, .09, 'triangle', .12, 90); break;
    case 'hard': tone(220, .14, 'sawtooth', .07, 60); break;
    case 'hold': tone(500, .08, 'sine', .08, 300); break;
    case 'click': tone(700, .05, 'sine', .06); break;
    case 'clear': [523, 659, 784, 1047, 1319].slice(0, Math.min(5, n + 1)).forEach((f, i) => tone(f, .14, 'triangle', .09, 0, i * .06)); break;
    case 'level': [523, 659, 784, 1047].forEach((f, i) => tone(f, .18, 'square', .05, 0, i * .09)); break;
    case 'special': [880, 1175, 1568].forEach((f, i) => tone(f, .09, 'square', .04, 0, i * .05)); break;
    case 'fill': [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, .1, 'sine', .08, 0, i * .05)); break;
    case 'shot': tone(1200, .08, 'square', .05, 180); break;
    case 'miss': tone(220, .15, 'triangle', .07, 110); break;
    case 'boom': noise(.6, .35); tone(140, .5, 'sawtooth', .12, 30); break;
    case 'over': [392, 330, 262, 196].forEach((f, i) => tone(f, .3, 'triangle', .1, 0, i * .18)); break;

}

/* ================= Vẽ gỗ ================= */
function rng(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647, (s - 1) / 2147483646); }

  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
const LIGHT = { a: '#dca468', b: '#c88a4c', l1: 'rgba(120,64,24,.20)', l2: 'rgba(255,225,180,.18)', seed: 11 };
const DARK = { a: '#5b3519', b: '#4a2911', l1: 'rgba(20,8,0,.30)', l2: 'rgba(140,90,50,.16)', seed: 29 };
function wood(c, x, y, w, h, t, seed) {
  const g = c.createLinearGradient(x, y, x + w, y);
  g.addColorStop(0, t.a); g.addColorStop(.45, t.b); g.addColorStop(.7, t.a); g.addColorStop(1, t.b);

  for (let i = 0; i < (w * h < 40000 ? 0 : w * h / 90000); i++) {
    const kx = x + r() * w, ky = y + r() * h, kr = 4 + r() * 8;
    for (let j = 0; j < 4; j++) {

/* ================= Bố cục ================= */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, L = {}, bg = null;
function boardDims() { return G ? { c: G.cols, r: G.rows } : SIZES[SET.size]; }
function safeTop() {
  const d = document.createElement('div');

  const hudTop = st + pad * .4 + topBar;

  audio();
  const x = e.clientX, y = e.clientY;
  if (inR(L.pause, x - 4, y - 4) || inR(L.pause, x + 4, y + 4)) { if (G && !G.over) pause(); else if (!G) showHome(); return; }
  if (inR(L.gear, x - 4, y - 4) || inR(L.gear, x + 4, y + 4)) { openSettingsInGame(); return; }
  if (!G || G.over || G.paused) return;
  if (inR(L.boxes[0], x, y)) { hold(); return; }
  for (const b of L.btns) if (inR(b, x, y)) { btnDown[b.k] = e.pointerId; press(b.k); buzz(6); return; }
  gest = { id: e.pointerId, x0: x, y0: y, ax: x, ay: y, t0: performance.now(), moved: false, axis: null };
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
});
cv.addEventListener('pointermove', e => {
  if (!gest || e.pointerId !== gest.id || !playing()) return;
  const step = Math.max(L.cell * .9, 16), x = e.clientX, y = e.clientY;
  if (!gest.axis) {
    const dx = Math.abs(x - gest.x0), dy = Math.abs(y - gest.y0);
    if (dx > step * .7 && dx >= dy) gest.axis = 'h';
    else if (dy > step * .7 && dy > dx) gest.axis = 'v';
  }
  if (gest.axis === 'h') {
    while (x - gest.ax >= step) { move(1); gest.ax += step; gest.moved = true; }
    while (x - gest.ax <= -step) { move(-1); gest.ax -= step; gest.moved = true; }
  } else if (gest.axis === 'v') {
    const dt = performance.now() - gest.t0;
    if (dt > 140) while (y - gest.ay >= step) { soft(); gest.ay += step; gest.moved = true; }
  }
});
function endGest(e) {
  for (const k in btnDown) if (btnDown[k] === e.pointerId) { delete btnDown[k]; release(k); }
  if (!gest || e.pointerId !== gest.id) return;
  const g = gest; gest = null;
  if (e.type === 'pointercancel' || !playing()) return;
  const dt = performance.now() - g.t0, dx = e.clientX - g.x0, dy = e.clientY - g.y0;
  const flick = Math.max(L.cell * 2.2, 40);
  if (dt < 300 && dy > flick && dy > Math.abs(dx) * 1.5) hard();
  else if (dt < 300 && -dy > flick && -dy > Math.abs(dx) * 1.5) hold();
  else if (!g.moved && dt < 350 && Math.hypot(dx, dy) < 14) rotate(1);
}
cv.addEventListener('pointerup', endGest);
cv.addEventListener('pointercancel', endGest);
window.addEventListener('keydown', e => {
  if (!ovHidden()) { if (e.key === 'Escape') onAndroidBack(); return; }
  if (e.key === 'Escape' || e.key === 'p') return pause();
  if (e.repeat) return;
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down', ArrowUp: 'rot', x: 'rot', ' ': 'drop' };
  if (map[e.key]) { press(map[e.key]); e.preventDefault(); }
  else if (e.key === 'z') rotate(-1);
  else if (e.key === 'c' || e.key === 'Shift') hold();
});
window.addEventListener('keyup', e => {
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowDown: 'down' };
  if (map[e.key]) release(map[e.key]);
});

const ov = document.getElementById('ov'), panel = document.getElementById('panel');
let screen = null, setFrom = 'home';
function ovHidden() { return ov.classList.contains('hidden'); }
function show(name, html) { screen = name; panel.innerHTML = html; ov.classList.remove('hidden'); panel.scrollTop = 0; }
function hide() { screen = null; ov.classList.add('hidden'); homeEl.classList.add('hidden'); }
const homeEl = document.getElementById('home');
function homeVisible() { return !homeEl.classList.contains('hidden'); }
let homeBgKey = '';
function homeBg() {
  const key = W + 'x' + H; if (homeBgKey === key) return; homeBgKey = key;
  const c = document.createElement('canvas'); c.width = Math.round(W); c.height = Math.round(H);
  const x = c.getContext('2d');
  wood(x, 0, 0, W, H, LIGHT, 13);
  const g = x.createRadialGradient(W / 2, H * .42, Math.min(W, H) * .2, W / 2, H / 2, Math.max(W, H) * .75);
  g.addColorStop(0, 'rgba(255,230,180,.18)'); g.addColorStop(1, 'rgba(50,22,6,.55)');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  homeEl.style.backgroundImage = 'url(' + c.toDataURL('image/jpeg', .85) + ')';
}
function drawArt() {
  const a = document.getElementById('art'); if (!a) return;
  const cs = 26, cols = 9, rows = 6, w = cols * cs, h = rows * cs;
  a.width = Math.round(w * dpr); a.height = Math.round(h * dpr); a.style.width = w + 'px'; a.style.height = h + 'px';
  const c = a.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cells = [
    // khối đang rơi (chữ L, phát sáng)
    [3, 0, 2], [4, 0, 2], [5, 0, 2], [5, 1, 2],
    // đống gạch bên dưới
    [0, 3, 1], [0, 4, 1], [1, 4, 1], [0, 5, 0], [1, 5, 0], [2, 5, 0], [2, 4, 6], [3, 4, 6], [3, 5, 6], [4, 5, 5], [5, 5, 5],
    [6, 5, 5], [6, 4, 4], [7, 4, 4], [7, 5, 4], [8, 5, 3], [8, 4, 3], [8, 3, 3], [7, 3, 4], [1, 3, 1]
  ];
  for (const [x, y, ci] of cells) {
    c.save();
    if (y < 2) { c.shadowColor = shade(COLORS[ci], .5); c.shadowBlur = 14; }
    c.drawImage(block(ci, cs), x * cs, y * cs, cs, cs); c.restore();
  }
  // bóng khối
  c.strokeStyle = 'rgba(255,240,210,.9)'; c.lineWidth = 2;
  for (const [x, y] of [[4, 3], [5, 3], [6, 3], [6, 2]]) { rr(c, x * cs + 3, y * cs + 3, cs - 6, cs - 6, 3); c.stroke(); }
}

}
function seg(key, opts) {
  return `<div class="seg">${opts.map(([v, t]) => `<button data-a="set" data-k="${key}" data-v="${v}" class="${String(SET[key]) === String(v) ? 'on' : ''}">${t}</button>`).join('')}</div>`;
}
function showSettings() {

    <div class="row">▶ Qua phải ${seg('bRight', [[true, 'Bật'], [false, 'Tắt']])}</div>

    <button class="btn" data-a="back">Xong</button>`);
}
function showRecords() {
  const r = Store.get('records', []);
  show('records', `<h2>Kỷ lục</h2>${r.length ? `<table><tr><th>#</th><th>Điểm</th><th>Cấp</th><th>Hàng</th><th>Ngày</th></tr>
    ${r.map((e, i) => `<tr><td>${i + 1}</td><td class="s">${e.s}</td><td>${e.lv}</td><td>${e.n}</td><td>${fmtDate(e.d)}</td></tr>`).join('')}</table>`
    : '<div class="note" style="margin:20px 0">Chưa có ván nào. Chơi thử một ván nhé!</div>'}
    <button class="btn" data-a="back">Quay lại</button>`);
}
function showHelp() {
  show('help', `<h2>Cách chơi</h2><div class="help">
    Xếp các khối gỗ rơi xuống cho <b>kín một hàng ngang</b> để xoá hàng và ghi điểm. Khối chồng lên tới đỉnh là thua.<br><br>

    • <b>▼ Súng</b> (thanh 3 ô + nòng chớp nháy): chạm màn hình hoặc phím Xoay để bắn phá viên gạch đầu tiên dưới nòng, có 10 viên đạn. +10 điểm/ô.<br><br>
    Xoá 1–4 hàng cùng lúc: 100 / 300 / 500 / 800 × cấp. Xoá liên tiếp được thưởng <b>liên hoàn</b>, xoá sạch bàn thưởng lớn.
    Mỗi 10 hàng lên 1 cấp, khối rơi nhanh hơn.</div>
    <button class="btn" data-a="back">Đã hiểu</button>`);
}
let backTo = 'home';
function onAct(e) {
  const b = e.target.closest('[data-a]'); if (!b) return;
  audio(); const a = b.dataset.a;
  if (a !== 'set') sfx('click');
  if (a === 'new') newGame();
  else if (a === 'continue') loadGame();
  else if (a === 'resume') resume();
  else if (a === 'home') { G = null; showHome(); }
  else if (a === 'settings') { backTo = screen; showSettings(); }
  else if (a === 'records') { backTo = screen; showRecords(); }
  else if (a === 'help') { backTo = screen; showHelp(); }
  else if (a === 'back') goBack();
  else if (a === 'set') {
    const k = b.dataset.k, raw = b.dataset.v;
    SET[k] = raw === 'true' ? true : raw === 'false' ? false : Number(raw);
    saveSet(); sfx('click');
    if (k[0] === 'b' || (!G && k === 'size')) layout();
    showSettings();
  }
}
panel.addEventListener('click', onAct);
homeEl.addEventListener('click', onAct);
function openSettingsInGame() {
  audio(); sfx('click');
  if (G && !G.over && !G.paused) { G.paused = true; releaseAll(); saveGame(); backTo = 'game'; }
  else backTo = screen || (G && G.over ? 'over' : G ? 'pause' : 'home');
  showSettings();
}
function goBack() {
  if (backTo === 'game' && G && !G.over) resume();
  else if (backTo === 'pause' && G && !G.over) showPause();
  else if (backTo === 'over' && G && G.over) showOver();
  else showHome();
}
window.onAndroidBack = function () {
  if (ovHidden()) {
    if (homeVisible()) { if (window.Android) Android.exit(); }
    else if (G && !G.over) pause();
    else if (G && G.over) showHome();
    return;
  }
  if (screen === 'home') { if (window.Android) Android.exit(); }
  else if (screen === 'pause') resume();
  else if (screen === 'over') showHome();
  else goBack();
};
window.onAndroidPause = function () {
  if (G && !G.over) { if (!G.paused && ovHidden()) pause(); else saveGame(); }
};
document.addEventListener('visibilitychange', () => { if (document.hidden) onAndroidPause(); });
window.addEventListener('resize', () => layout());
